<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaginaAura</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-arrows">
        <svg class="arrows-svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
            <defs>
                <filter id="neonGlowArrow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            
            <!-- Flechas verdes (subida) -->
            <polygon points="100,500 120,450 140,500" fill="#00ff64" stroke="#00ff64" stroke-width="1.5" opacity="0.4" filter="url(#neonGlowArrow)" />
            <polygon points="250,550 270,500 290,550" fill="#00ff64" stroke="#00ff64" stroke-width="1.5" opacity="0.3" filter="url(#neonGlowArrow)" />
            <polygon points="400,480 420,430 440,480" fill="#00ff64" stroke="#00ff64" stroke-width="1.5" opacity="0.35" filter="url(#neonGlowArrow)" />
            <polygon points="550,520 570,470 590,520" fill="#00ff64" stroke="#00ff64" stroke-width="1.5" opacity="0.4" filter="url(#neonGlowArrow)" />
            <polygon points="700,490 720,440 740,490" fill="#00ff64" stroke="#00ff64" stroke-width="1.5" opacity="0.3" filter="url(#neonGlowArrow)" />
            <polygon points="850,530 870,480 890,530" fill="#00ff64" stroke="#00ff64" stroke-width="1.5" opacity="0.35" filter="url(#neonGlowArrow)" />
            
            <!-- Flechas rojas (bajada) -->
            <polygon points="150,100 170,150 190,100" fill="#ff0064" stroke="#ff0064" stroke-width="1.5" opacity="0.4" filter="url(#neonGlowArrow)" />
            <polygon points="300,80 320,130 340,80" fill="#ff0064" stroke="#ff0064" stroke-width="1.5" opacity="0.35" filter="url(#neonGlowArrow)" />
            <polygon points="450,120 470,170 490,120" fill="#ff0064" stroke="#ff0064" stroke-width="1.5" opacity="0.3" filter="url(#neonGlowArrow)" />
            <polygon points="600,90 620,140 640,90" fill="#ff0064" stroke="#ff0064" stroke-width="1.5" opacity="0.4" filter="url(#neonGlowArrow)" />
            <polygon points="750,110 770,160 790,110" fill="#ff0064" stroke="#ff0064" stroke-width="1.5" opacity="0.35" filter="url(#neonGlowArrow)" />
            <polygon points="900,100 920,150 940,100" fill="#ff0064" stroke="#ff0064" stroke-width="1.5" opacity="0.3" filter="url(#neonGlowArrow)" />
        </svg>
    </div>

    <div class="info-text">
        Se dan 1000 puntos por ganarle la carrera a los demás espermatozoides
    </div>

    <div class="page-content">
        <div class="title-container">
            <h1 class="title">AUROMETRO</h1>
            <div class="title-glow"></div>
        </div>

        <div class="container">
            <div class="box-wrapper" data-value="1000">
                <div class="number">1000</div>
                <div class="box"></div>
                <p class="name">José</p>
            </div>
            <div class="box-wrapper" data-value="1000">
                <div class="number">1000</div>
                <div class="box"></div>
                <p class="name">Johan</p>
            </div>
            <div class="box-wrapper" data-value="1000">
                <div class="number">1000</div>
                <div class="box"></div>
                <p class="name">Andrea</p>
            </div>
            <div class="box-wrapper" data-value="1000">
                <div class="number">1000</div>
                <div class="box"></div>
                <p class="name">Paula</p>
            </div>
            <div class="box-wrapper" data-value="1000">
                <div class="number">1000</div>
                <div class="box"></div>
                <p class="name">Sofia</p>
            </div>
            <div class="box-wrapper" data-value="1000">
                <div class="number">1000</div>
                <div class="box"></div>
                <p class="name">Zoe</p>
            </div>
            <div class="box-wrapper" data-value="1000">
                <div class="number">1000</div>
                <div class="box"></div>
                <p class="name">Juan</p>
            </div>
        </div>
    </div>

    <!-- Menú principal -->
    <div class="menu-popup" id="menuPopup">
        <button class="menu-option menu-gain-btn" data-action="gain">
            <span class="option-icon">↑</span> Ganó aura
        </button>
        <button class="menu-option menu-lose-btn" data-action="lose">
            <span class="option-icon">↓</span> Perdió aura
        </button>
    </div>

    <!-- Submenú Ganó aura -->
    <div class="submenu-popup" id="submenuGain">
        <button class="submenu-option" data-points="500">
            <span class="submenu-icon">⚡</span> Encaro a una lea (+500)
        </button>
        <button class="submenu-option" data-points="200">
            <span class="submenu-icon">💬</span> Gano una discusión (+200)
        </button>
        <button class="submenu-option" data-points="100">
            <span class="submenu-icon">📚</span> Gano un examen importante (+100)
        </button>
    </div>

    <!-- Submenú Perdió aura -->
    <div class="submenu-popup" id="submenuLose">
        <button class="submenu-option" data-points="-300">
            <span class="submenu-icon">🚪</span> Abrió una puerta hacia dentro (-300)
        </button>
        <button class="submenu-option" data-points="-500">
            <span class="submenu-icon">💥</span> Se cayó en público (-500)
        </button>
        <button class="submenu-option" data-points="-700">
            <span class="submenu-icon">😴</span> Durmió en una clase (-700)
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
